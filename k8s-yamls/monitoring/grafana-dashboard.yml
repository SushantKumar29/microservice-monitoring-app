apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-monitoring-dashboard
  labels:
    grafana_dashboard: "1" # Auto load Grafana
    app: grafana
data:
  job-metrics-dashboard.json: |
    {
      "title": "Microservices Monitoring Dashboard",
      "uid": "job-metrics-001",
      "panels": [
        {
          "title": "Jobs Submitted Rate",
          "type": "graph",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "rate(total_jobs_submitted[1m])",
              "legendFormat": "Jobs/sec"
            }
          ]
        },
        {
          "title": "Jobs Processed Rate",
          "type": "graph",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "rate(total_jobs_completed[1m])",
              "legendFormat": "Jobs/sec"
            }
          ]
        },
        {
          "title": "Active Workers",
          "type": "stat",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 4},
          "targets": [
            {
              "expr": "count(kube_deployment_status_replicas{deployment='worker-deploy'})",
              "legendFormat": "Worker Count"
            }
          ]
        },
        {
          "title": "CPU Usage by Worker",
          "type": "graph",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~'worker-deploy-.*'}[1m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Job Processing Duration (95th percentile)",
          "type": "graph",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(job_processing_time_seconds_bucket[5m]))",
              "legendFormat": "P95 Duration"
            }
          ]
        },
        {
          "title": "Queue Length",
          "type": "graph",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "queue_length",
              "legendFormat": "Jobs Waiting"
            }
          ]
        },
        {
          "title": "Errors Rate",
          "type": "graph",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "rate(total_job_errors[1m])",
              "legendFormat": "Errors/sec"
            }
          ]
        }
      ]
    }
