apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-monitoring-dashboard
  labels:
    grafana_dashboard: '1' # Auto load Grafana
    app: grafana
data:
  job-metrics-dashboard.json: |
    {
      "title": "Microservices Monitoring Dashboard",
      "uid": "job-metrics-001",
      "panels": [
        {
          "title": "Total Jobs Submitted (All Services)",
          "type": "stat",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "targets": [
            {"expr": "sum(total_jobs_submitted)", "legendFormat": "Total"}
          ]
        },
        {
          "title": "Total Jobs Completed (All Services)", 
          "type": "stat",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "targets": [
            {"expr": "sum(total_jobs_completed)", "legendFormat": "Total"}
          ]
        },
        {
          "title": "Active Workers",
          "type": "stat",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "targets": [
            {"expr": "count(kube_deployment_status_replicas{deployment='worker-deploy'})"}
          ]
        },
        {
          "title": "Worker Replicas",
          "type": "stat",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "targets": [
            {"expr": "kube_deployment_status_replicas{deployment='worker-deploy'}"}
          ]
        },
        {
          "title": "Jobs Submitted Rate (Worker)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "targets": [
            {"expr": "rate(total_jobs_submitted[1m])", "legendFormat": "Worker"}
          ]
        },
        {
          "title": "Jobs Completed Rate",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "targets": [
            {"expr": "rate(total_jobs_completed[1m])", "legendFormat": "Jobs/sec"}
          ]
        },
        {
          "title": "CPU Usage by Worker Pods",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "targets": [
            {"expr": "sum(rate(container_cpu_usage_seconds_total[1m])) by (pod)", "legendFormat": "{{pod}}"}
          ]
        },
        {
          "title": "Failed Jobs (Stats Service)",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "targets": [
            {"expr": "total_jobs_failed", "legendFormat": "Failed Jobs"}
          ]
        },
        {
          "title": "Queue Length",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
          "targets": [
            {"expr": "queue_length", "legendFormat": "Queue Length"}
          ]
        },
        {
          "title": "Worker Scaling",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
          "targets": [
            {"expr": "kube_deployment_status_replicas{deployment='worker-deploy'}", "legendFormat": "Desired"},
            {"expr": "kube_deployment_status_available_replicas{deployment='worker-deploy'}", "legendFormat": "Available"}
          ]
        },
        {
          "title": "Jobs Summary by Service",
          "type": "table",
          "gridPos": {"x": 0, "y": 28, "w": 24, "h": 8},
          "targets": [
            {"expr": "sum by (instance) (total_jobs_completed)", "legendFormat": "{{instance}}"}
          ]
        }
      ],
      "time": {"from": "now-1h", "to": "now"},
      "refresh": "30s"
    }
