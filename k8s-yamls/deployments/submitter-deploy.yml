apiVersion: apps/v1
kind: Deployment
metadata:
  name: submitter-deploy
  labels:
    name: submitter-deploy
    app: monitoring-app
spec:
  replicas: 1
  selector:
    matchLabels:
      name: submitter-pod
      app: monitoring-app
  template:
    metadata:
      name: submitter-pod
      labels:
        name: submitter-pod
        app: monitoring-app
    spec:
      containers:
        - name: submitter-pod
          image: job-submitter
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_URL
              value: "redis://redis:6379"
