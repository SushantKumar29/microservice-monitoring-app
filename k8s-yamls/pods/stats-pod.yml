apiVersion: v1
kind: Pod
metadata:
  name: stats-pod
  labels:
    name: stats-pod
    app: monitoring-app
spec:
  containers:
    - name: stats-pod
      image: job-stats
      imagePullPolicy: Never
      ports:
        - containerPort: 80
      env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_URL
          value: "redis://redis:6379"
