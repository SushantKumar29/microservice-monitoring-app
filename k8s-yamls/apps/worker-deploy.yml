apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-app
      component: worker
  template:
    metadata:
      labels:
        app: monitoring-app
        component: worker
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3001'
        prometheus.io/path: '/metrics'
    spec:
      containers:
        - name: worker
          image: job-worker
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: REDIS_HOST
              value: 'redis'
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_URL
              value: 'redis://redis:6379'
            - name: PORT
              value: '3001'
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
