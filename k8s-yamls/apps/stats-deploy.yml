apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-app
      component: stats
  template:
    metadata:
      labels:
        app: monitoring-app
        component: stats
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3002'
        prometheus.io/path: '/metrics'
    spec:
      containers:
        - name: stats
          image: job-stats
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: REDIS_HOST
              value: 'redis'
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_URL
              value: 'redis://redis:6379'
            - name: PORT
              value: '3002'
